<aside class="sidebar">
  <ul class="menu-list">
    <li *ngFor="let item of menuItems" 
        [class.active]="isActive(item.route)"
        [routerLink]="item.route">
      <!-- SINGLE ICON ONLY - FIXED -->
      <i [class]="item.icon" class="menu-icon-pi"></i>
      <span class="menu-label">{{ item.label }}</span>
    </li>
  </ul>
</aside>
